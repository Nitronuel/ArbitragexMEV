[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./"}]

[profile.default.model_checker]
engine = "chc"

[rpc_endpoints]
rhc = "https://rpc.mainnet.chain.robinhood.com"
