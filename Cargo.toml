[workspace]
members = [
    "crates/catalog",
    "crates/domain",
    "crates/provider",
    "crates/shadow",
    "crates/shadow-bot",
    "crates/simulation",
    "crates/state",
    "crates/storage",
    "crates/v2-math",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
alloy-primitives = { version = "1.7.1", features = ["serde"] }
alloy-provider = { version = "2.4", default-features = false, features = ["reqwest", "reqwest-rustls-tls", "rpc-api"] }
alloy-signer-local = { version = "2.4", default-features = false }
alloy-network = { version = "2.4", default-features = false }
alloy-consensus = { version = "2.4", default-features = false }
alloy-rpc-types-eth = { version = "2.4", default-features = false }
alloy-sol-types = { version = "1.7.1", default-features = false }
clap = { version = "4.5.0", features = ["derive"] }
criterion = "0.7.0"
csv = "1.4.0"
proptest = "1.7.0"
serde_json = "1.0.145"
ruint = "1.20.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
signal-hook = "0.3.18"
base64 = "0.22.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2.0.17"
tempfile = "3.23.0"
toml = "0.9.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
